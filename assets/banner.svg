<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="40%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#065f46" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f293d" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <style>
    .grid-bg { opacity: 0.7; }
    .pulse-circle {
      animation: pulseGlow 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: dashFlow 20s linear infinite;
    }
    .waterfall-bar-1 { animation: barGrow1 3s ease-in-out infinite alternate; }
    .waterfall-bar-2 { animation: barGrow2 3.5s ease-in-out infinite alternate; }
    .waterfall-bar-3 { animation: barGrow3 4s ease-in-out infinite alternate; }
    .floating-card {
      animation: floatMotion 6s ease-in-out infinite alternate;
    }
    .floating-card-2 {
      animation: floatMotion2 7s ease-in-out infinite alternate;
    }

    @keyframes dashFlow {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.25; transform: scale(0.98); }
      100% { opacity: 0.65; transform: scale(1.02); }
    }
    @keyframes floatMotion {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes floatMotion2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes barGrow1 {
      0% { height: 45px; y: 255px; }
      100% { height: 75px; y: 225px; }
    }
    @keyframes barGrow2 {
      0% { height: 60px; y: 240px; }
      100% { height: 100px; y: 200px; }
    }
    @keyframes barGrow3 {
      0% { height: 70px; y: 230px; }
      100% { height: 115px; y: 185px; }
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" class="grid-bg" />

  <!-- DYNAMIC / ANIMATED BACKGROUND ELEMENTS -->
  <!-- Ambient glowing spheres -->
  <circle cx="150" cy="80" r="130" fill="#2563eb" opacity="0.15" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1050" cy="260" r="160" fill="#059669" opacity="0.15" filter="url(#glow)" class="pulse-circle" />

  <!-- Dynamic Animated Waterfall Financial Chart (Background subtle) -->
  <g opacity="0.35" class="floating-card-2">
    <!-- Chart Area Background Grid -->
    <line x1="880" y1="300" x2="1140" y2="300" stroke="#334155" stroke-width="1.5" />
    <line x1="880" y1="240" x2="1140" y2="240" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />
    <line x1="880" y1="180" x2="1140" y2="180" stroke="#334155" stroke-dasharray="4 4" stroke-width="1" />

    <!-- Animated Revenue Waterfall Bars -->
    <rect x="895" y="240" width="28" height="60" rx="4" fill="#3b82f6" class="waterfall-bar-1" />
    <rect x="935" y="220" width="28" height="80" rx="4" fill="#0ea5e9" class="waterfall-bar-2" />
    <rect x="975" y="200" width="28" height="100" rx="4" fill="#10b981" class="waterfall-bar-3" />
    <rect x="1015" y="170" width="28" height="130" rx="4" fill="#34d399" />
    <rect x="1055" y="150" width="28" height="150" rx="4" fill="#6ee7b7" />

    <!-- Flow curve over bars -->
    <path d="M 895 240 Q 950 210, 1015 170 T 1090 145" fill="none" stroke="#38bdf8" stroke-width="2.5" class="flow-line" />
  </g>

  <!-- Flowing Data Waveform Line (Bottom Background) -->
  <path d="M 0 320 Q 300 270, 600 310 T 1200 290" fill="none" stroke="#1e40af" stroke-width="2" opacity="0.4" class="flow-line" />
  <path d="M 0 330 Q 350 350, 700 315 T 1200 325" fill="none" stroke="#059669" stroke-width="1.5" opacity="0.4" class="flow-line" />

  <!-- DYNAMIC PILLS (Decorative Badges in safe positions) -->
  <g class="floating-card" opacity="0.9">
    <!-- Top Pill: ASC 606 & IFRS 15 Compliance -->
    <rect x="65" y="42" width="280" height="34" rx="17" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1" />
    <circle cx="82" cy="59" r="5" fill="#34d399" filter="url(#softGlow)" />
    <text x="96" y="64" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      ⚖️ ASC 606 &amp; IFRS 15 COMPLIANCE
    </text>
  </g>

  <g class="floating-card-2" opacity="0.85">
    <!-- Right Upper Pill: Financial Automation -->
    <rect x="910" y="42" width="225" height="34" rx="17" fill="#1e293b" stroke="#10b981" stroke-width="1" />
    <circle cx="927" cy="59" r="5" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="940" y="64" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
      📊 RECORD-TO-REPORT (R2R)
    </text>
  </g>

  <!-- FOREGROUND TEXT - ENSURED HIGH CONTRAST & CLEAR VISIBILITY -->
  <g>
    <!-- Main Title -->
    <text x="65" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5" filter="url(#softGlow)">
      Awesome Revenue Recognition
    </text>
    <text x="65" y="202" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.3">
      &amp; Financial Reporting 📈✨
    </text>

    <!-- Subtitle -->
    <text x="65" y="248" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">
      A Curated Index of Enterprise SaaS Platforms &amp; Open-Source Accounting Engines
    </text>

    <!-- Capability Tags in Foreground -->
    <g transform="translate(65, 276)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="12" y="18" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">⚡ Deferred Rev Waterfalls</text>

      <!-- Tag 2 -->
      <rect x="175" y="0" width="160" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="187" y="18" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">📑 Close &amp; Reconciliations</text>

      <!-- Tag 3 -->
      <rect x="345" y="0" width="170" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="357" y="18" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600">🌐 Audit-Ready Subledgers</text>
    </g>
  </g>
</svg>